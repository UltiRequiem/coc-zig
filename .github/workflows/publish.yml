name: Publish

# Releases to npm (trusted publishing) and creates a GitHub Release.
#  - every push to the default branch, unless the commit message has "[skip release]"
#  - a daily check: merges made with the built-in GITHUB_TOKEN (Dependabot auto-merge)
#    do not trigger other workflows, so this catches anything not released yet
#  - manually, with an optional bump (patch / minor / major)
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto reads the commit message)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Is there something to release?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          MSG=$(gh api "repos/$REPO/commits/$GITHUB_SHA" --jq .commit.message)

          # files changed outside .github/ (a workflow-only commit, like a Dependabot action bump, ships nothing)
          shipped() {
            if [[ -n "${1:-}" ]]; then
              gh api "repos/$REPO/compare/$1...$GITHUB_SHA" --jq '[.files[].filename] | map(select(startswith(".github/") | not)) | length'
            else
              gh api "repos/$REPO/commits/$GITHUB_SHA" --jq '[.files[].filename] | map(select(startswith(".github/") | not)) | length'
            fi
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$MSG" == *"[skip release]"* ]]; then
            echo "Commit asks to skip the release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            TAG=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName // ""')
            LAST=""
            [[ -n "$TAG" ]] && LAST=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || echo "")
            if [[ "$LAST" == "$GITHUB_SHA" ]]; then
              echo "Latest release already covers $GITHUB_SHA"
              echo "release=false" >> "$GITHUB_OUTPUT"
            elif [[ -n "$LAST" && "$(shipped "$LAST")" == "0" ]]; then
              echo "Only workflow files changed since $TAG"
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$(shipped "")" == "0" ]]; then
            echo "Only workflow files changed, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

      # Next version = latest published version bumped by commit message:
      # :boom: or "!:" -> major, :sparkles: or "feat" -> minor, else patch.
      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MESSAGE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message)
          NAME=$(node -p "require('./package.json').name")
          # npm's read API lags a publish by minutes, so also look at the GitHub releases and take the higher
          NPM_V=$(npm view "$NAME" version 2>/dev/null || echo "0.0.0")
          REL_V=$(gh release list --limit 30 --json tagName --jq '.[].tagName' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          CURRENT=$(printf '%s\n%s\n' "$NPM_V" "${REL_V:-0.0.0}" | sort -V | tail -1)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          SUBJECT=$(printf '%s' "$MESSAGE" | head -n 1)
          BUMP="${{ inputs.bump }}"
          if [[ -z "$BUMP" || "$BUMP" == "auto" ]]; then
            if [[ "$SUBJECT" == *":boom:"* || "$SUBJECT" == *"!:"* ]]; then BUMP=major
            elif [[ "$SUBJECT" == *":sparkles:"* || "$SUBJECT" == feat* ]]; then BUMP=minor
            else BUMP=patch; fi
          fi
          if [[ "$BUMP" == "major" ]]; then
            NEXT="$((MAJOR + 1)).0.0"
          elif [[ "$BUMP" == "minor" ]]; then
            NEXT="$MAJOR.$((MINOR + 1)).0"
          else
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME $CURRENT -> $NEXT"

      - run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: pnpm run build
      - name: Verify entry points exist
        run: >-
          node -e "const p=require('./package.json');
          const bin=typeof p.bin==='string'?[p.bin]:Object.values(p.bin??{});
          for(const f of [p.main,...bin].filter(Boolean))require('fs').accessSync(f)"
      - name: Publish to npm
        id: npm_publish
        run: |
          set -o pipefail
          if ! npm publish --access public 2>&1 | tee publish.log; then
            if grep -q "cannot publish over the previously published" publish.log; then
              echo "::notice::${{ steps.version.outputs.version }} is already on npm (a previous run published it)."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
            else
              exit 1
            fi
          fi

      # npm is the product: a missing GitHub Release must not turn a successful publish red.
      - name: Create GitHub Release
        if: steps.npm_publish.outputs.skipped != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes \
              || echo "::warning::Could not create release $TAG (the built-in token cannot tag some commits)."
          fi
